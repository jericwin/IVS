<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — IVS</title>
  <meta name="description" content="Log in to your IVS account.">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◆</text></svg>">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 120px 24px;
    }
    
    .auth-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
    }
    
    .auth-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.3;
      filter: blur(8px);
    }
    
    .auth-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(10, 10, 10, 0.85);
    }
    
    .auth-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 48px;
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6);
      animation: fadeUp 0.8s var(--ease-out-expo) forwards;
    }
    
    .auth-header {
      text-align: center;
      margin-bottom: 40px;
    }
    
    .auth-title {
      font-family: var(--font-display);
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    
    .auth-subtitle {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .form-label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }
    
    .form-input {
      width: 100%;
      padding: 16px;
      background: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-family: var(--font-primary);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.3s;
    }
    
    .form-input:focus {
      border-color: var(--accent);
    }
    
    .auth-btn {
      margin-top: 10px;
      width: 100%;
      padding: 16px;
      background: var(--accent);
      color: var(--bg-primary);
      font-family: var(--font-primary);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      transition: all 0.4s var(--ease-out-expo);
    }
    
    .auth-btn:hover {
      background: var(--accent-light);
    }
    
    .auth-links {
      margin-top: 24px;
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
    }
    
    .auth-links a {
      color: var(--text-secondary);
      transition: color 0.3s;
    }
    
    .auth-links a:hover {
      color: var(--accent);
    }
    
    .auth-alt {
      text-align: center;
      margin-top: 30px;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    
    .auth-alt a {
      color: var(--accent);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav class="nav" id="navbar">
    <a href="index.html" class="nav-logo"><img src="images/logo.png" alt="IVS Logo"></a>
    <div class="nav-links" id="navLinks">
      <a href="index.html#products">Collection</a>
      <a href="index.html#features">Why IVS</a>
      <a href="index.html#story">Our Story</a>
      <a href="index.html#newsletter">Contact</a>
      <a href="signup.html" class="nav-cta">Sign Up</a>
    </div>
  </nav>

  <!-- Login Section -->
  <div class="auth-page">
    <div class="auth-bg">
      <img src="images/hero-bg.png" alt="Background">
    </div>
    
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Enter your details to access your account.</p>
      </div>
      
      <form class="auth-form" action="index.html">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" placeholder="Enter your email" required>
        </div>
        
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" placeholder="Enter your password" required>
        </div>
        
        <div class="auth-links">
          <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <input type="checkbox"> Remember me
          </label>
          <a href="#">Forgot password?</a>
        </div>
        
        <button type="submit" class="auth-btn">Log In</button>
      </form>
      
      <div class="auth-alt">
        Don't have an account? <a href="signup.html">Sign Up</a>
      </div>
    </div>
  </div>

  <script>
    // Navbar Scroll Effect
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
      navbar.classList.toggle('scrolled', window.scrollY > 50);
    });
  </script>
</body>
</html>
