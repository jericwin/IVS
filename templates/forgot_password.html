<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - IVS</title>
  <meta name="description" content="Reset your IVS account password.">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" type="image/png" href="/static/images/logo.png">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 120px 24px;
    }
    
    .auth-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
    }
    
    .auth-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.3;
      filter: blur(8px);
    }
    
    .auth-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(10, 10, 10, 0.85);
    }
    
    .auth-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 48px;
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6);
      animation: fadeUp 0.8s var(--ease-out-expo) forwards;
    }
    
    .auth-header {
      text-align: center;
      margin-bottom: 40px;
    }
    
    .auth-title {
      font-family: var(--font-display);
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    
    .auth-subtitle {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .form-label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }
    
    .form-input {
      width: 100%;
      padding: 16px;
      background: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-family: var(--font-primary);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.3s;
    }
    
    .form-input:focus {
      border-color: var(--accent);
    }
    
    .auth-btn {
      margin-top: 10px;
      width: 100%;
      padding: 16px;
      background: var(--accent);
      color: var(--bg-primary);
      font-family: var(--font-primary);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      transition: all 0.4s var(--ease-out-expo);
    }
    
    .auth-btn:hover {
      background: var(--accent-light);
    }
    
    .auth-alt {
      text-align: center;
      margin-top: 30px;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    
    .auth-alt a {
      color: var(--accent);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav class="nav" id="navbar">
    <a href="/" class="nav-logo"><img src="/static/images/logo.png" alt="IVS Logo"></a>
    <div class="nav-links" id="navLinks">
      <a href="/login" class="nav-cta">Log In</a>
      <div class="theme-switch-wrapper" style="margin-left: 20px;">
        <label class="theme-switch">
          <input type="checkbox" onchange="const ev = new Event('change'); this.dispatchEvent(ev);" class="theme-checkbox" />
          <div class="slider round">
            <span class="icon-sun" style="display:flex; color:var(--text-secondary);"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg></span>
            <span class="icon-moon" style="display:flex; color:var(--text-secondary);"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></span>
          </div>
        </label>
      </div>
    </div>
  </nav>

  <!-- Forgot Password Section -->
  <div class="auth-page">
    <div class="auth-bg">
      <img src="/static/images/hero-bg.png" alt="Background">
    </div>
    
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Reset Password</h1>
        <p class="auth-subtitle">Enter your email and we'll send you a verification code.</p>
      </div>
      
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          {% for message in messages %}
            <div class="flash-message" style="background: var(--accent); color: var(--bg-primary); padding: 12px; border-radius: 4px; margin-bottom: 24px; font-weight: 600; text-align: center; font-size: 0.9rem; transition: opacity 0.5s;">
              {{ message }}
            </div>
          {% endfor %}
          <script>
            setTimeout(() => {
              document.querySelectorAll('.flash-message').forEach(el => {
                el.style.opacity = '0';
                setTimeout(() => el.remove(), 500);
              });
            }, 3000);
          </script>
        {% endif %}
      {% endwith %}
      
      <form class="auth-form" method="POST" action="/forgot-password">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-input" placeholder="Enter your registered email" name="email" required>
        </div>
        
        <button type="submit" class="auth-btn">Send Reset Code</button>
      </form>
      
      <div class="auth-alt">
        Remember your password? <a href="/login">Log In</a>
      </div>
    </div>
  </div>

  <script>
    // Navbar Scroll Effect
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
      navbar.classList.toggle('scrolled', window.scrollY > 50);
    });
  </script>
  <script src="/static/theme.js"></script>
  {% include 'chatbot.html' %}
</body>
</html>
